name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SLINT_NO_QT: "1"

jobs:
  rust-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- --deny warnings
      - name: Cargo test
        run: cargo test --workspace --all-targets
      - name: Cargo check
        run: cargo check --workspace --all-targets

  flutter-ux-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Widget smoke test
        run: flutter test test/widget_test.dart
      - name: Document import and persistence tests
        run: flutter test test/document_repository_test.dart
      - name: Desktop/mobile UX flow tests
        run: flutter test test/ux_flow_test.dart
      - name: Text pipeline performance guardrail
        run: flutter test test/performance/text_pipeline_perf_test.dart

  android-rust-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cargo check Android Rust core
        run: cargo check --target aarch64-linux-android --no-default-features

  android-emulator-screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android project
        run: flutter create --platforms=android --project-name just_read_it .
      - name: Flutter pub get
        run: flutter pub get
      - name: Capture screenshots on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: flutter_client
          script: |
            set -eux
            mkdir -p build/screenshots
            flutter run -t lib/screenshot_app.dart -d emulator-5554 --debug --no-pub > build/screenshots/flutter-run.log 2>&1 &
            RUN_PID=$!
            for i in $(seq 1 90); do
              if adb shell pidof com.example.just_read_it >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            sleep 5
            adb exec-out screencap -p > build/screenshots/01_editor_mobile.png
            adb shell input tap 195 785
            sleep 3
            adb exec-out screencap -p > build/screenshots/02_player_mobile.png
            kill $RUN_PID || true
      - name: Upload emulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: flutter_client/build/screenshots/*.png
          if-no-files-found: error
