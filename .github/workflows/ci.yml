name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SLINT_NO_QT: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      flutter: ${{ steps.filter.outputs.flutter }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Detect changed areas
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            head="${{ github.event.pull_request.head.sha }}"
            if [[ "${{ github.event.action }}" == "synchronize" && -n "${{ github.event.before }}" ]]; then
              base="${{ github.event.before }}"
            else
              git fetch origin "${{ github.base_ref }}" --depth=1
              base="$(git merge-base "$head" "origin/${{ github.base_ref }}")"
            fi
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "$head")"
            fi
          fi

          git diff --name-only "$base" "$head" | tee changed-files.txt

          changed() {
            grep -Eq "$1" changed-files.txt && echo true || echo false
          }

          ci_pattern='^\.github/workflows/ci\.yml$'
          rust_pattern='^(rust_core/|tools/|\.github/workflows/ci\.yml$)'
          flutter_pattern='^(flutter_client/|rust_core/|tools/|\.github/workflows/ci\.yml$)'
          android_pattern='^(flutter_client/|rust_core/|tools/|\.github/workflows/ci\.yml$)'
          ios_pattern='^(flutter_client/|rust_core/|tools/|\.github/workflows/ci\.yml$)'

          {
            echo "rust=$(changed "$rust_pattern")"
            echo "flutter=$(changed "$flutter_pattern")"
            echo "android=$(changed "$android_pattern")"
            echo "ios=$(changed "$ios_pattern")"
          } >> "$GITHUB_OUTPUT"

  rust-lint-and-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- --deny warnings
      - name: Cargo test
        run: cargo test --workspace --all-targets
      - name: Cargo check
        run: cargo check --workspace --all-targets

  flutter-ux-tests:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter tests
        run: flutter test

  android-rust-check:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cargo check Android Rust core
        run: cargo check --target aarch64-linux-android --no-default-features

  ios-rust-check:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Cargo check iOS Rust core
        run: cargo check --target aarch64-apple-ios-sim --no-default-features --features bridge,flite

  ios-simulator-screenshots:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Flutter pub get
        run: flutter pub get
      - name: Run full iOS simulator UI flow
        run: bash tool/ios_screenshots.sh
      - name: Upload iOS simulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: |
            flutter_client/build/screenshots/*.png
            flutter_client/build/screenshots/*.log
            flutter_client/build/screenshots/*.json
            flutter_client/build/screenshots/*.wav
          if-no-files-found: error

  android-emulator-screenshots:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android project
        run: flutter create --platforms=android --project-name just_read_it .
      - name: Flutter pub get
        run: flutter pub get
      - name: Patch Android audio service activity
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main -name MainActivity.kt -o -name MainActivity.java | head -1)
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity not found" >&2
            exit 1
          fi
          if [[ "$MAIN_ACTIVITY" == *.kt ]]; then
            cat > "$MAIN_ACTIVITY" <<'KOTLIN'
          package com.example.just_read_it

          class MainActivity : com.ryanheise.audioservice.AudioServiceActivity()
          KOTLIN
          else
            cat > "$MAIN_ACTIVITY" <<'JAVA'
          package com.example.just_read_it;

          public class MainActivity extends com.ryanheise.audioservice.AudioServiceActivity {}
          JAVA
          fi
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'xmlns:tools=' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools">',
              )
          permissions = [
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace('<application', f'{permission}\n    <application', 1)
          if 'android:usesCleartextTraffic=' not in text:
              text = text.replace(
                  '<application',
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )
          if 'android:importantForAutofill=' not in text:
              text = text.replace(
                  '<activity\n            android:name=".MainActivity"',
                  '<activity\n            android:importantForAutofill="noExcludeDescendants"\n            android:name=".MainActivity"',
                  1,
              )
          service_block = '''
                  <service
                      android:name="com.ryanheise.audioservice.AudioService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback"
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>
                  <receiver
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true"
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>
          '''
          if 'com.ryanheise.audioservice.AudioService' not in text:
              text = text.replace('    </application>', service_block + '    </application>')
          manifest.write_text(text)
          PY
      - name: Install Rust Android target
        run: rustup target add x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Android Rust bridge library
        run: |
          cd ../rust_core
          cargo ndk -t x86_64 \
            -o ../flutter_client/android/app/src/main/jniLibs \
            build --no-default-features --features bridge,flite
      - name: Run full emulator UI flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          disable-animations: false
          working-directory: flutter_client
          script: |
            bash tool/android_screenshots.sh
            bash tool/check_no_system_dialogs.sh
      - name: Upload emulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: |
            flutter_client/build/screenshots/*.png
            flutter_client/build/screenshots/*.log
            flutter_client/build/screenshots/*.xml
            flutter_client/build/screenshots/*.txt
            flutter_client/build/screenshots/*.wav
          if-no-files-found: error
