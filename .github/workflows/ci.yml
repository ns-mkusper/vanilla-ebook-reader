name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SLINT_NO_QT: "1"

jobs:
  rust-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- --deny warnings
      - name: Cargo test
        run: cargo test --workspace --all-targets
      - name: Cargo check
        run: cargo check --workspace --all-targets

  flutter-ux-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Widget smoke test
        run: flutter test test/widget_test.dart
      - name: Document import and persistence tests
        run: flutter test test/document_repository_test.dart
      - name: Desktop/mobile UX flow tests
        run: flutter test test/ux_flow_test.dart
      - name: Capture app screenshots
        run: dart run tool/generate_ci_screenshots.dart
      - name: Upload app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: flutter_client/build/screenshots/*
          if-no-files-found: error
      - name: Text pipeline performance guardrail
        run: flutter test test/performance/text_pipeline_perf_test.dart

  android-rust-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cargo check Android Rust core
        run: cargo check --target aarch64-linux-android --no-default-features
